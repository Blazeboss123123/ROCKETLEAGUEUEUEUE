<title>Project Overdrive</title>
<meta name="description" content="Rocket-car football: offline bot matches, training drills, and browser-hosted multiplayer.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:ital,wght@0,500;0,600;0,700;1,700&family=Inter:wght@400;500;600&display=swap">
<style>
/* Single deliberate dark look: a night stadium with an electric-cyan accent, blue and orange team colours. */
:root { color-scheme: dark; }
html, body { height: 100%; }
:root {
  --bg: #05070d;
  --panel: rgba(10, 14, 26, 0.86);
  --panel-solid: #0b1020;
  --panel-2: rgba(22, 30, 52, 0.9);
  --line: rgba(148, 163, 200, 0.18);
  --line-strong: rgba(148, 163, 200, 0.4);
  --text: #e8edf7;
  --muted: #8f9bb7;
  --accent: #5ee1ff;
  --accent-ink: #001a22;
  --blue: #2f7dff;
  --orange: #ff8a1f;
  --good: #34d399;
  --bad: #f87171;
  --warn: #fbbf24;
  --display: 'Chakra Petch', 'Rajdhani', 'Segoe UI', system-ui, sans-serif;
  --body: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;
  --ui-scale: 1;
  --cut: 14px;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font-family: var(--body); overflow: hidden; -webkit-font-smoothing: antialiased; }
button, input, select { font: inherit; color: inherit; }
#app { position: fixed; inset: 0; }
.game-canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.ui-layer { position: absolute; inset: 0; pointer-events: none; font-size: calc(15px * var(--ui-scale)); }
.ui-layer > * { pointer-events: auto; }
.ui-layer .passive, .ui-layer .passive * { pointer-events: none; }
.hidden { display: none !important; }

/* ---------- generic ---------- */
.screen { position: absolute; inset: 0; display: flex; flex-direction: column; padding: 28px 40px; overflow: auto; }
.screen.dim { background: linear-gradient(90deg, rgba(5,7,13,0.92) 0%, rgba(5,7,13,0.7) 45%, rgba(5,7,13,0.15) 100%); }
.screen.solid { background: radial-gradient(1200px 700px at 70% 10%, #0f1a33 0%, #070a14 60%, #04060b 100%); }
.topbar { display: flex; align-items: center; gap: 16px; margin-bottom: 22px; }
.topbar h1 { font-family: var(--display); font-weight: 700; letter-spacing: 0.08em; font-size: 1.9em; margin: 0; text-transform: uppercase; }
.topbar .spacer { flex: 1; }
.crumb { color: var(--muted); font-family: var(--display); letter-spacing: 0.14em; text-transform: uppercase; font-size: 0.8em; }
.panel { background: var(--panel); border: 1px solid var(--line); clip-path: polygon(0 0, calc(100% - var(--cut)) 0, 100% var(--cut), 100% 100%, var(--cut) 100%, 0 calc(100% - var(--cut))); padding: 18px 20px; backdrop-filter: blur(6px); }
.panel h2, .panel h3 { font-family: var(--display); letter-spacing: 0.08em; text-transform: uppercase; margin: 0 0 12px; font-weight: 600; }
.panel h2 { font-size: 1.15em; } .panel h3 { font-size: 0.95em; color: var(--muted); }
.muted { color: var(--muted); }
.small { font-size: 0.85em; }
.row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.col { display: flex; flex-direction: column; gap: 10px; }
.grow { flex: 1; }
.kbd { display: inline-block; padding: 1px 7px; border: 1px solid var(--line-strong); border-bottom-width: 2px; border-radius: 4px; font-family: var(--display); font-size: 0.85em; background: rgba(255,255,255,0.04); }

.btn { appearance: none; border: 1px solid var(--line-strong); background: rgba(255,255,255,0.04); padding: 10px 18px; cursor: pointer; font-family: var(--display); font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; font-size: 0.92em; transition: background .12s, border-color .12s, transform .08s, color .12s; clip-path: polygon(0 0, calc(100% - 8px) 0, 100% 8px, 100% 100%, 8px 100%, 0 calc(100% - 8px)); }
.btn:hover { background: rgba(94,225,255,0.12); border-color: var(--accent); }
.btn:active { transform: translateY(1px); }
.btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.primary:hover { background: #8ceaff; }
.btn.danger:hover { background: rgba(248,113,113,0.15); border-color: var(--bad); }
.btn.ghost { border-color: transparent; background: transparent; }
.btn:disabled { opacity: 0.4; cursor: not-allowed; }
.btn.sm { padding: 6px 12px; font-size: 0.8em; }
.btn.on { border-color: var(--accent); background: rgba(94,225,255,0.18); }

/* ---------- main menu ---------- */
.menu-main { justify-content: center; max-width: 560px; }
.logo { font-family: var(--display); font-weight: 700; line-height: 0.9; margin-bottom: 34px; }
.logo .l1 { font-size: 1.05em; letter-spacing: 0.5em; color: var(--muted); }
.logo .l2 { font-size: 4.2em; letter-spacing: 0.04em; background: linear-gradient(100deg, #fff 0%, #bdefff 45%, var(--accent) 100%); -webkit-background-clip: text; background-clip: text; color: transparent; font-style: italic; }
.logo .bar { height: 4px; width: 220px; margin-top: 14px; background: linear-gradient(90deg, var(--blue), var(--accent) 50%, var(--orange)); }
.mainnav { display: flex; flex-direction: column; gap: 6px; }
.navbtn { appearance: none; text-align: left; background: transparent; border: none; border-left: 3px solid transparent; padding: 9px 16px; font-family: var(--display); font-size: 1.45em; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #c5cee3; cursor: pointer; transition: all .12s; }
.navbtn:hover, .navbtn:focus-visible { color: #fff; border-left-color: var(--accent); background: linear-gradient(90deg, rgba(94,225,255,0.14), transparent); padding-left: 24px; outline: none; }
.navbtn.big { font-size: 2.1em; color: #fff; }
.navbtn small { display: block; font-family: var(--body); font-size: 0.42em; letter-spacing: 0.04em; text-transform: none; color: var(--muted); font-weight: 400; }
.player-card { position: absolute; right: 36px; top: 28px; width: 320px; padding: 0; overflow: hidden; }
.player-card .banner { height: 64px; }
.player-card .pc-body { padding: 12px 16px 16px; }
.player-card .name { font-family: var(--display); font-size: 1.35em; font-weight: 700; }
.player-card .title { font-family: var(--display); color: var(--accent); letter-spacing: 0.18em; font-size: 0.75em; }
.xpbar { height: 6px; background: rgba(255,255,255,0.08); margin-top: 8px; position: relative; overflow: hidden; }
.xpbar > i { position: absolute; inset: 0 auto 0 0; background: linear-gradient(90deg, var(--accent), #a78bfa); }
.netbadge { position: absolute; right: 36px; bottom: 26px; font-size: 0.8em; color: var(--muted); display: flex; gap: 8px; align-items: center; }
.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; background: var(--muted); }
.dot.ok { background: var(--good); box-shadow: 0 0 8px var(--good); } .dot.warn { background: var(--warn); } .dot.bad { background: var(--bad); }

/* ---------- tiles ---------- */
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 16px; }
.tile { position: relative; cursor: pointer; min-height: 170px; padding-top: 44px; display: flex; flex-direction: column; justify-content: flex-end; transition: transform .12s, border-color .12s; }
.tile:hover { transform: translateY(-2px); border-color: var(--accent); }
.tile.locked { cursor: default; opacity: 0.55; } .tile.locked:hover { transform: none; border-color: var(--line); }
.tile .tag { position: absolute; top: 14px; left: 18px; font-family: var(--display); font-size: 0.72em; letter-spacing: 0.2em; color: var(--accent); text-transform: uppercase; }
.tile .t { font-family: var(--display); font-size: 1.5em; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; }
.tile p { margin: 6px 0 0; color: var(--muted); font-size: 0.9em; }
.seg { display: inline-flex; border: 1px solid var(--line-strong); }
.seg button { appearance: none; background: transparent; border: none; padding: 7px 13px; cursor: pointer; font-family: var(--display); font-weight: 600; letter-spacing: 0.06em; color: var(--muted); }
.seg button.on { background: var(--accent); color: var(--accent-ink); }
.seg button:not(.on):hover { color: #fff; background: rgba(255,255,255,0.06); }
input.text { background: rgba(0,0,0,0.35); border: 1px solid var(--line-strong); padding: 9px 12px; min-width: 0; }
input.text:focus { outline: none; border-color: var(--accent); }
input.code { font-family: var(--display); font-size: 1.4em; letter-spacing: 0.3em; text-transform: uppercase; width: 9.5em; }
select.sel { background: #0b1222; border: 1px solid var(--line-strong); padding: 8px 10px; }

/* ---------- lobby ---------- */
.lobby-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
.teamcol { border-top: 3px solid var(--c); }
.teamcol h2 { color: var(--c); }
.pl { display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-bottom: 1px solid var(--line); min-height: 44px; }
.pl .nm { flex: 1; font-weight: 600; }
.pl .tagb { font-family: var(--display); font-size: 0.7em; letter-spacing: 0.12em; padding: 2px 7px; border: 1px solid var(--line-strong); color: var(--muted); }
.pl .tagb.ready { color: var(--good); border-color: var(--good); }
.pl .tagb.bot { color: #c4b5fd; border-color: #c4b5fd; }
.pl.empty { color: var(--muted); font-style: italic; }
.codebox { font-family: var(--display); font-size: 2.2em; letter-spacing: 0.32em; font-weight: 700; color: var(--accent); }
.spinner { width: 46px; height: 46px; border: 3px solid rgba(255,255,255,0.1); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.9s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ---------- HUD ---------- */
.hud { position: absolute; inset: 0; pointer-events: none; font-family: var(--display); }
.hud * { pointer-events: none; }
.scorebug { position: absolute; top: 14px; left: 50%; transform: translateX(-50%); display: flex; align-items: stretch; filter: drop-shadow(0 4px 12px rgba(0,0,0,0.5)); }
.scorebug .sc { min-width: 74px; text-align: center; font-size: 2.2em; font-weight: 700; padding: 2px 14px; }
.scorebug .sc.b { background: linear-gradient(180deg, var(--blue), #1a4fb0); clip-path: polygon(12px 0, 100% 0, 100% 100%, 0 100%); }
.scorebug .sc.o { background: linear-gradient(180deg, var(--orange), #b85600); clip-path: polygon(0 0, calc(100% - 12px) 0, 100% 100%, 0 100%); }
.scorebug .clock { background: rgba(6,9,18,0.92); min-width: 120px; text-align: center; font-size: 1.9em; font-weight: 600; padding: 4px 16px; letter-spacing: 0.04em; }
.scorebug .clock.ot { color: var(--warn); }
.pips { position: absolute; top: 70px; left: 50%; transform: translateX(-50%); display: flex; gap: 140px; font-size: 0.78em; }
.pips .side { display: flex; gap: 6px; }
.pips .pip { padding: 2px 8px; background: rgba(6,9,18,0.75); border-bottom: 2px solid var(--c); white-space: nowrap; max-width: 120px; overflow: hidden; text-overflow: ellipsis; }
.pips .pip.dc { opacity: 0.45; text-decoration: line-through; }
.boost { position: absolute; right: 34px; bottom: 30px; width: 170px; height: 170px; }
.boost svg { width: 100%; height: 100%; transform: rotate(135deg); }
.boost .num { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 3.2em; font-weight: 700; line-height: 1; }
.boost .num small { font-size: 0.26em; letter-spacing: 0.3em; color: var(--muted); margin-top: 4px; }
.boost.empty .num { color: var(--bad); animation: blink .5s steps(2) infinite; }
@keyframes blink { 50% { opacity: 0.4; } }
.center-msg { position: absolute; top: 34%; left: 0; right: 0; text-align: center; text-shadow: 0 4px 24px rgba(0,0,0,0.7); }
.center-msg .big { font-size: 7em; font-weight: 700; line-height: 1; font-style: italic; letter-spacing: 0.02em; }
.center-msg .sub { font-size: 1.4em; letter-spacing: 0.2em; text-transform: uppercase; margin-top: 8px; }
.center-msg.pop .big { animation: pop .5s cubic-bezier(.2,1.6,.4,1); }
@keyframes pop { from { transform: scale(0.4); opacity: 0; } to { transform: scale(1); opacity: 1; } }
.goal-banner { position: absolute; top: 26%; left: 0; right: 0; text-align: center; }
.goal-banner .g { display: inline-block; font-size: 6em; font-weight: 700; font-style: italic; padding: 0 60px; background: linear-gradient(90deg, transparent, var(--c) 20%, var(--c) 80%, transparent); animation: slide .6s cubic-bezier(.2,1.2,.4,1); }
.goal-banner .who { margin-top: 10px; font-size: 1.3em; letter-spacing: 0.1em; text-shadow: 0 2px 10px #000; }
@keyframes slide { from { transform: translateX(-60px) skewX(-10deg); opacity: 0; } to { transform: none; opacity: 1; } }
.netinfo { position: absolute; top: 14px; right: 18px; font-family: var(--body); font-size: 0.78em; color: var(--muted); text-align: right; line-height: 1.5; background: rgba(6,9,18,0.55); padding: 4px 8px; }
.feed { position: absolute; left: 18px; bottom: 26px; width: 340px; display: flex; flex-direction: column; gap: 4px; font-family: var(--body); font-size: 0.88em; }
.feed div { background: rgba(6,9,18,0.7); padding: 4px 9px; border-left: 3px solid var(--c, var(--accent)); animation: fadein .2s; }
@keyframes fadein { from { opacity: 0; transform: translateX(-8px); } }
.toast-mid { position: absolute; top: 62%; left: 0; right: 0; text-align: center; font-size: 1.2em; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }
.replay-tag { position: absolute; top: 100px; left: 50%; transform: translateX(-50%); font-size: 1em; letter-spacing: 0.4em; padding: 4px 14px; background: rgba(220,38,38,0.85); }
.drillbox { position: absolute; top: 14px; left: 50%; transform: translateX(-50%); text-align: center; background: rgba(6,9,18,0.8); padding: 8px 22px; min-width: 300px; }
.drillbox .h { font-size: 1.3em; font-weight: 700; letter-spacing: 0.08em; } .drillbox .s { font-family: var(--body); color: var(--muted); font-size: 0.85em; }
.quickchat { position: absolute; left: 18px; bottom: 200px; background: rgba(6,9,18,0.9); padding: 10px 14px; font-family: var(--body); font-size: 0.9em; pointer-events: none; border-left: 3px solid var(--accent); }
.quickchat div { padding: 2px 0; } .quickchat b { color: var(--accent); margin-right: 8px; }

/* ---------- overlay / modal ---------- */
.overlay { position: absolute; inset: 0; background: rgba(3,5,10,0.6); backdrop-filter: blur(4px); display: flex; align-items: center; justify-content: center; }
.modal { min-width: 380px; max-width: 92vw; max-height: 88vh; overflow: auto; }
.scoreboard table, table.stats { border-collapse: collapse; width: 100%; font-family: var(--body); }
table.stats th { font-family: var(--display); font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); font-size: 0.75em; text-align: right; padding: 6px 10px; border-bottom: 1px solid var(--line); }
table.stats th:first-child, table.stats td:first-child { text-align: left; }
table.stats td { padding: 8px 10px; text-align: right; border-bottom: 1px solid var(--line); font-variant-numeric: tabular-nums; }
table.stats tr.me td { background: rgba(94,225,255,0.08); }
table.stats tr.team-head td { font-family: var(--display); letter-spacing: 0.1em; color: var(--c); border-bottom: 2px solid var(--c); font-weight: 700; }

/* ---------- results ---------- */
.result-head { text-align: center; margin: 10px 0 20px; font-family: var(--display); }
.result-head .w { font-size: 4.5em; font-weight: 700; font-style: italic; letter-spacing: 0.02em; }
.result-head .s { font-size: 2em; letter-spacing: 0.1em; }
.mvp { color: var(--warn); font-family: var(--display); font-size: 0.75em; letter-spacing: 0.15em; margin-left: 6px; }

/* ---------- garage ---------- */
.garage { display: grid; grid-template-columns: 220px 1fr 360px; gap: 18px; height: calc(100% - 64px); min-height: 0; padding: 18px 28px 22px; }
.garage > * { min-height: 0; }
.garage .cats { display: flex; flex-direction: column; gap: 4px; overflow: auto; }
.cat { appearance: none; text-align: left; background: transparent; border: none; border-left: 3px solid transparent; padding: 8px 12px; cursor: pointer; font-family: var(--display); letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.cat.on, .cat:hover { color: #fff; border-left-color: var(--accent); background: rgba(94,225,255,0.08); }
.cat small { display: block; text-transform: none; letter-spacing: 0; font-family: var(--body); font-weight: 400; color: var(--muted); font-size: 0.8em; }
.items { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; overflow: auto; align-content: start; max-height: calc(100vh - 220px); }
.item { appearance: none; border: 1px solid var(--line); background: rgba(255,255,255,0.03); padding: 12px; text-align: left; cursor: pointer; min-height: 64px; display: flex; flex-direction: column; gap: 3px; }
.item:hover { border-color: var(--line-strong); }
.item.on { border-color: var(--accent); background: rgba(94,225,255,0.1); }
.item.locked { opacity: 0.45; cursor: not-allowed; }
.item .n { font-family: var(--display); font-weight: 600; letter-spacing: 0.04em; }
.item .d { font-size: 0.78em; color: var(--muted); }
.swatches { display: grid; grid-template-columns: repeat(8, 1fr); gap: 8px; }
.sw { aspect-ratio: 1; border: 2px solid transparent; cursor: pointer; }
.sw.on { border-color: #fff; box-shadow: 0 0 0 2px var(--accent); }
.garage-stage { position: relative; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; pointer-events: none; }
.garage-stage .hint { pointer-events: none; color: var(--muted); font-size: 0.8em; margin-bottom: 8px; }
.garage-stage .row { pointer-events: auto; }

/* ---------- settings ---------- */
.settings { display: grid; grid-template-columns: 200px 1fr; gap: 20px; flex: 1; min-height: 0; }
.setlist { overflow: auto; max-height: calc(100vh - 160px); }
.setrow { display: grid; grid-template-columns: 1fr 300px; gap: 16px; align-items: center; padding: 10px 4px; border-bottom: 1px solid var(--line); }
.setrow .lbl { font-weight: 500; } .setrow .lbl small { display: block; color: var(--muted); font-size: 0.8em; font-weight: 400; }
.setrow input[type=range] { width: 100%; accent-color: var(--accent); }
.setrow .val { font-family: var(--display); min-width: 48px; text-align: right; color: var(--accent); }
.bind { min-width: 120px; }
.bind.capturing { border-color: var(--warn); color: var(--warn); animation: blink .6s steps(2) infinite; }
.toggle { width: 46px; height: 24px; border-radius: 12px; background: rgba(255,255,255,0.12); position: relative; cursor: pointer; border: none; }
.toggle::after { content: ''; position: absolute; width: 18px; height: 18px; top: 3px; left: 3px; border-radius: 50%; background: #cbd5e1; transition: left .12s; }
.toggle.on { background: var(--accent); } .toggle.on::after { left: 25px; background: #001a22; }

.toasts { position: absolute; bottom: 24px; left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; gap: 8px; align-items: center; pointer-events: none; z-index: 50; }
.toast { background: var(--panel-solid); border: 1px solid var(--line-strong); padding: 10px 18px; border-left: 3px solid var(--accent); animation: fadein .2s; max-width: 70vw; }
.toast.err { border-left-color: var(--bad); } .toast.ok { border-left-color: var(--good); }
.fps { position: absolute; left: 10px; top: 8px; font: 12px monospace; color: #a3e635; pointer-events: none; }
.credits p { max-width: 720px; line-height: 1.6; color: #cbd5e1; }
@media (max-width: 900px) {
  .screen { padding: 18px; }
  .garage { grid-template-columns: 1fr; grid-template-rows: auto 280px auto; overflow: auto; }
  .lobby-grid, .settings { grid-template-columns: 1fr; }
  .player-card { position: static; width: auto; margin-top: 18px; }
  .logo .l2 { font-size: 3em; }
  .setrow { grid-template-columns: 1fr; }
}
@media (max-width: 1100px) {
  .pips { gap: 40px; font-size: 0.7em; }
  .boost { width: 120px; height: 120px; right: 16px; bottom: 16px; }
  .boost .num { font-size: 2.2em; }
  .scorebug .sc { font-size: 1.6em; min-width: 54px; }
  .scorebug .clock { font-size: 1.4em; min-width: 90px; }
}

.board-hint { position: absolute; top: 96px; left: 50%; transform: translateX(-50%); font-family: var(--body); font-size: 0.72em; letter-spacing: 0.12em; color: rgba(226,232,240,0.55); text-transform: uppercase; }

/* ---------- tablet / touch controls ---------- */
.ui-layer > .touch-ctl { position: absolute; inset: 0; pointer-events: none; z-index: 5; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
.touch-ctl.hidden { display: none; }
.tc-zone { position: absolute; left: 0; top: 18%; bottom: 0; width: 46%; pointer-events: auto; touch-action: none; }
.tc-base { position: absolute; left: calc(110px * var(--tc-scale)); top: calc(100% - 120px * var(--tc-scale)); width: calc(132px * var(--tc-scale)); height: calc(132px * var(--tc-scale));
  margin: calc(-66px * var(--tc-scale)) 0 0 calc(-66px * var(--tc-scale)); border-radius: 50%; border: 2px solid rgba(255,255,255,0.35);
  background: radial-gradient(circle, rgba(255,255,255,0.10), rgba(10,14,26,0.35)); opacity: calc(var(--tc-alpha) * 0.8); transition: opacity .15s; }
.tc-base.active { opacity: calc(var(--tc-alpha) + 0.25); }
.tc-knob { position: absolute; left: 50%; top: 50%; width: 46%; height: 46%; margin: -23% 0 0 -23%; border-radius: 50%;
  background: radial-gradient(circle at 40% 35%, #ffffff, #b9c3d6); box-shadow: 0 4px 14px rgba(0,0,0,0.45); }
.tc-btn { position: absolute; pointer-events: auto; touch-action: none; border-radius: 50%; display: flex; align-items: center; justify-content: center;

// ------------------------------------------------------------------ textures
function canvas(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return [c, c.getContext('2d')]; }
function tex(c, { repeat = false, srgb = true, aniso = 4 } = {}) {
  const t = new THREE.CanvasTexture(c);
  if (repeat) t.wrapS = t.wrapT = THREE.RepeatWrapping;
  if (srgb) t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = aniso;
  return t;
}

function wallTexture(theme) {
  const [c, g] = canvas(256, 256);
  const [r, gg, b] = theme.wall;
  g.fillStyle = `rgba(${r},${gg},${b},0.16)`; g.fillRect(0, 0, 256, 256);
  if (theme.wallStyle === 'hex') {
    g.strokeStyle = `rgba(${r},${gg},${b},0.7)`; g.lineWidth = 2.5;
    const R = 32, w = R * Math.sqrt(3);
    for (let row = -1; row < 6; row++) for (let col = -1; col < 6; col++) {
      const cx = col * w + (row % 2 ? w / 2 : 0), cy = row * R * 1.5;
      g.beginPath();
      for (let i = 0; i < 6; i++) { const a = Math.PI / 6 + (i * Math.PI) / 3; g.lineTo(cx + Math.cos(a) * R, cy + Math.sin(a) * R); }
      g.closePath(); g.stroke();
    }
  } else {
    g.strokeStyle = `rgba(${r},${gg},${b},0.8)`; g.lineWidth = 3; g.strokeRect(1.5, 1.5, 253, 253);
    g.strokeStyle = `rgba(${r},${gg},${b},0.22)`; g.lineWidth = 1;
    for (let i = 32; i < 256; i += 32) { g.beginPath(); g.moveTo(i, 0); g.lineTo(i, 256); g.stroke(); g.beginPath(); g.moveTo(0, i); g.lineTo(256, i); g.stroke(); }
  }
  return tex(c, { repeat: true });
}

function netTexture(color) {
  const [c, g] = canvas(128, 128);
  g.strokeStyle = color; g.lineWidth = 2.5; g.globalAlpha = 0.9;
  for (let i = 0; i <= 128; i += 16) { g.beginPath(); g.moveTo(i, 0); g.lineTo(i - 64, 128); g.stroke(); g.beginPath(); g.moveTo(i, 0); g.lineTo(i + 64, 128); g.stroke(); }
  return tex(c, { repeat: true });
}

// ------------------------------------------------------------------ floor markings
function floorTexture(arena, theme, colors) {
  const a = arena.halfW, b = arena.halfL;
  const W = 1024, Hh = Math.round((1024 * b) / a);
  const [c, g] = canvas(W, Hh);
  const sx = W / (2 * a), sz = Hh / (2 * b);
  const X = (x) => (x + a) * sx, Z = (z) => (b - z) * sz; // +z (orange) at the top of the texture
  const M = (m) => m * sx;
  const tint = (col, z0, z1, alpha = '30') => { const grd = g.createLinearGradient(0, Z(z0), 0, Z(z1)); grd.addColorStop(0, col + '00'); grd.addColorStop(1, col + alpha); g.fillStyle = grd; g.fillRect(0, Math.min(Z(z0), Z(z1)), W, Math.abs(Z(z1) - Z(z0))); };
  const circle = (x, z, r, fill) => { g.beginPath(); g.arc(X(x), Z(z), M(r), 0, Math.PI * 2); if (fill) g.fill(); else g.stroke(); };

  if (arena.mode === 'hoops') {
    // hardwood planks
    g.fillStyle = theme.floor; g.fillRect(0, 0, W, Hh);
    const plank = M(0.55);
    for (let y = 0, k = 0; y < Hh; y += plank, k++) {
      g.fillStyle = k % 3 === 0 ? theme.floor2 : k % 3 === 1 ? theme.floor : '#b07c45';
      g.fillRect(0, y, W, plank - 1);
      g.fillStyle = 'rgba(60,30,10,0.35)'; g.fillRect(0, y + plank - 1, W, 1);
      for (let x = ((k * 97) % 160) - 160; x < W; x += 160 + ((k * 31) % 60)) g.fillRect(x, y, 1.5, plank);
    }
    g.fillStyle = 'rgba(255,240,220,0.06)'; g.fillRect(0, 0, W, Hh);
    tint(colors[1].css, 0, b, '28'); tint(colors[0].css, 0, -b, '28');
    g.strokeStyle = theme.line; g.lineWidth = 6;
    g.beginPath(); g.moveTo(0, Z(0)); g.lineTo(W, Z(0)); g.stroke();
    circle(0, 0, 7); g.lineWidth = 4; circle(0, 0, 2.5);
    for (const team of [0, 1]) {
      const s = team ? 1 : -1, hz = s * arena.hoopZ, col = colors[team].css;
      // key (painted lane) in team colour
      const kw = 5.2, kl = 13;
      g.fillStyle = col + '70';
      g.fillRect(X(-kw), Math.min(Z(s * b), Z(s * (b - kl))), M(2 * kw), M(kl));
      g.strokeStyle = theme.line; g.lineWidth = 5;
      g.strokeRect(X(-kw), Math.min(Z(s * b), Z(s * (b - kl))), M(2 * kw), M(kl));
      circle(0, s * (b - kl), kw);
      // three-point arc around the rim
      g.save(); g.beginPath(); g.rect(0, s > 0 ? 0 : Z(0), W, Hh / 2); g.clip();
      g.lineWidth = 6; circle(0, hz, 17); g.restore();
      // hoop shadow ring under the rim
      g.strokeStyle = col; g.lineWidth = 4; circle(0, hz, HOOPS.rimRadius);
    }
  } else if (arena.mode === 'dropshot') {
    const grd = g.createRadialGradient(W / 2, Hh / 2, 10, W / 2, Hh / 2, Hh * 0.7);
    grd.addColorStop(0, '#16203a'); grd.addColorStop(1, theme.floor);
    g.fillStyle = grd; g.fillRect(0, 0, W, Hh);
    tint(colors[1].css, 0, b, '40'); tint(colors[0].css, 0, -b, '40');
    // glowing halfway line between the two tile fields
    const lg = g.createLinearGradient(0, Z(0) - 18, 0, Z(0) + 18);
    lg.addColorStop(0, 'rgba(120,220,255,0)'); lg.addColorStop(0.5, 'rgba(200,245,255,0.95)'); lg.addColorStop(1, 'rgba(120,220,255,0)');
    g.fillStyle = lg; g.fillRect(0, Z(0) - 18, W, 36);
  } else {
    for (let i = 0; i < 16; i++) { g.fillStyle = i % 2 ? theme.floor : theme.floor2; g.fillRect(0, (Hh / 16) * i, W, Hh / 16 + 1); }
    // diagonal mowing pattern
    g.fillStyle = 'rgba(255,255,255,0.025)';
    for (let i = -Hh; i < W; i += 64) { g.beginPath(); g.moveTo(i, 0); g.lineTo(i + 32, 0); g.lineTo(i + 32 + Hh, Hh); g.lineTo(i + Hh, Hh); g.fill(); }
    tint(colors[1].css, 0, b); tint(colors[0].css, 0, -b);
    g.strokeStyle = theme.line; g.lineWidth = 6;
    g.beginPath(); g.moveTo(0, Z(0)); g.lineTo(W, Z(0)); g.stroke();
    circle(0, 0, 10);
    g.fillStyle = theme.line; g.beginPath(); g.arc(X(0), Z(0), 9, 0, Math.PI * 2); g.fill();
    const gw = arena.goalHalfW;
    for (const s of [1, -1]) {
      g.strokeStyle = theme.line; g.lineWidth = 5;
      g.strokeRect(X(-gw - 4), Math.min(Z(s * b), Z(s * (b - 9))), (2 * gw + 8) * sx, 9 * sz);
      g.beginPath(); g.arc(X(0), Z(s * (b - 9)), 6 * sx, s > 0 ? 0 : Math.PI, s > 0 ? Math.PI : Math.PI * 2); g.stroke();
      g.strokeStyle = colors[s > 0 ? 1 : 0].css; g.lineWidth = 10;
      g.beginPath(); g.moveTo(X(-gw), Z(s * b)); g.lineTo(X(gw), Z(s * b)); g.stroke();
    }
  }
  // kickoff spawn markers
  g.fillStyle = 'rgba(255,255,255,0.5)';
  for (const team of [0, 1]) for (const sp of arena.kickoffSpawns(team, 5, () => 0)) { g.beginPath(); g.arc(X(sp.pos.x), Z(sp.pos.z), 7, 0, Math.PI * 2); g.fill(); }
  return tex(c, { aniso: 8 });
}

// ------------------------------------------------------------------ bowl
// Per-column profile: floor fillet (column's own radius), straight wall rows shared by every
// column, ceiling fillet. Every column has the same number of rows, so the shell is a grid.
function profileFor(r, wallYs, H, K) {
  const rows = [];
  for (let i = 0; i <= K; i++) { const th = (Math.PI / 2) * i / K; rows.push({ d: r - r * Math.sin(th), y: r - r * Math.cos(th) }); }
  for (const y of wallYs) rows.push({ d: 0, y });
  for (let i = 0; i <= K; i++) { const th = (Math.PI / 2) * i / K; rows.push({ d: r - r * Math.cos(th), y: H - r + r * Math.sin(th) }); }
  let v = 0;
  rows.forEach((row, i) => { if (i) v += Math.hypot(row.d - rows[i - 1].d, row.y - rows[i - 1].y); row.v = v; });
  return rows;
}

function buildBowl(arena, theme, colors) {
  const p = arena.p, H = p.height, gh = p.goalHeight, gw = arena.goalHalfW;
  const soccar = arena.mode === 'soccar';
  const cols = arena.outline(1.2);
  const NC = cols.length, K = 8;
  const rMax = Math.max(arena.rSide, arena.rEnd);
  const lo = rMax, hi = H - rMax;
  const wallYs = [];
  const n = Math.max(2, Math.round((hi - lo) / 1.6));
  for (let k = 1; k < n; k++) wallYs.push(lo + ((hi - lo) * k) / n);
  if (soccar && gh > lo + 0.05 && gh < hi - 0.05) { wallYs.push(gh); wallYs.sort((x, y) => x - y); }
  const mouth = (c) => soccar && c.endWall && Math.abs(c.x) <= gw + 1e-6;
  const profiles = cols.map((c) => profileFor(c.r, wallYs, H, K));
  const NR = profiles[0].length;
  let u = 0;
  const pos = [], uv = [], col = [], idx = [];
  for (let i = 0; i < NC; i++) {
    const c = cols[i];
    if (i) u += Math.hypot(c.x - cols[i - 1].x, c.z - cols[i - 1].z);
    for (const row of profiles[i]) {
      pos.push(c.x - c.nx * row.d, row.y, c.z - c.nz * row.d);
      uv.push(u / 6, row.v / 6);
      const t = Math.min(1, Math.max(0, (row.y - 1) / (H * 0.6)));
      const a0 = Math.min(0.88, theme.wallAlpha[0] + 0.16), a1 = theme.wallAlpha[1] + 0.1;
      col.push(1, 1, 1, a0 + (a1 - a0) * t);
    }
  }
  const vtx = (i, j) => (i % NC) * NR + j;
  for (let i = 0; i < NC; i++) {
    const i2 = (i + 1) % NC;
    for (let j = 0; j < NR - 1; j++) {
      // cut the goal mouth (and the floor fillet in front of it) out of the end walls
      if (mouth(cols[i]) && mouth(cols[i2]) && profiles[i][j + 1].y <= gh + 1e-6) continue;
      idx.push(vtx(i, j), vtx(i2, j), vtx(i, j + 1), vtx(i2, j), vtx(i2, j + 1), vtx(i, j + 1));
    }
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  geo.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
  geo.setAttribute('color', new THREE.Float32BufferAttribute(col, 4));
  geo.setIndex(idx);
  geo.computeVertexNormals();
  const shellMat = new THREE.MeshStandardMaterial({
    map: wallTexture(theme), transparent: true, vertexColors: true, side: THREE.DoubleSide, roughness: 0.35, metalness: 0.1,
    depthWrite: false, emissive: new THREE.Color(theme.accent), emissiveIntensity: 0.06,
  });
  // glass reads more solid at grazing angles (fresnel), so walls are clear when driving on them
  shellMat.onBeforeCompile = (sh) => {
    sh.fragmentShader = sh.fragmentShader.replace('#include <opaque_fragment>',
      'float fres = pow(1.0 - abs(dot(normalize(normal), normalize(vViewPosition))), 3.0);\n diffuseColor.a = min(0.96, diffuseColor.a * (1.0 + fres * 2.2) + fres * 0.08);\n #include <opaque_fragment>');
  };
  const shell = new THREE.Mesh(geo, shellMat);
  shell.renderOrder = 2;

  // glowing trim where the floor fillet meets the wall, blue at one end fading to orange at the other
  const trim = (yOf, height, dIn) => {
    const tp = [], tc = [], ti = [];
    const cb = new THREE.Color(colors[0].main), co = new THREE.Color(colors[1].main), cw = new THREE.Color(0xffffff), cc = new THREE.Color();
    for (let i = 0; i <= NC; i++) {
      const c = cols[i % NC], y0 = yOf(c);
      tp.push(c.x - c.nx * dIn, y0, c.z - c.nz * dIn, c.x - c.nx * dIn, y0 + height, c.z - c.nz * dIn);
      const k = Math.max(-1, Math.min(1, c.z / (arena.halfL * 0.7)));
      cc.copy(cw).multiplyScalar(0.55).lerp(k < 0 ? cb : co, Math.abs(k));
      tc.push(cc.r, cc.g, cc.b, cc.r, cc.g, cc.b);
      if (i < NC && !(mouth(c) && mouth(cols[(i + 1) % NC]) && y0 < gh)) ti.push(2 * i, 2 * i + 2, 2 * i + 1, 2 * i + 2, 2 * i + 3, 2 * i + 1);
    }
    const tg = new THREE.BufferGeometry();
    tg.setAttribute('position', new THREE.Float32BufferAttribute(tp, 3));
    tg.setAttribute('color', new THREE.Float32BufferAttribute(tc, 3));
    tg.setIndex(ti);
    return new THREE.Mesh(tg, new THREE.MeshBasicMaterial({ vertexColors: true, color: new THREE.Color(2.2, 2.2, 2.2), side: THREE.DoubleSide, transparent: true, opacity: 0.95, depthWrite: false }));
  };
  const trims = [trim((c) => c.r + 0.15, 0.22, 0.03), trim((c) => H - c.r - 0.4, 0.18, 0.03)];

  // floor polygon: where each fillet starts (or the wall line inside the goal mouth)
  const shape = new THREE.Shape();
  const fp = [];
  for (let i = 0; i < NC; i++) {
    const c = cols[i], prev = cols[(i + NC - 1) % NC];
    const inner = soccar && c.endWall && Math.abs(c.x) < gw - 1e-6;
    const post = soccar && c.endWall && Math.abs(Math.abs(c.x) - gw) < 1e-6;
    const ptAt = (d) => [c.x - c.nx * d, c.z - c.nz * d];
    if (post) {
      const prevIn = prev.endWall && Math.abs(prev.x) < gw - 1e-6;
      if (prevIn) fp.push(ptAt(0), ptAt(c.r)); else fp.push(ptAt(c.r), ptAt(0));
    } else fp.push(ptAt(inner ? 0 : c.r));
  }
  fp.forEach(([x, z], i) => (i ? shape.lineTo(x, -z) : shape.moveTo(x, -z)));
  const a = arena.halfW, b = arena.halfL;
  const floorGeo = new THREE.ShapeGeometry(shape);
  floorGeo.rotateX(-Math.PI / 2);
  const fpa = floorGeo.attributes.position, fuv = floorGeo.attributes.uv;
  for (let i = 0; i < fpa.count; i++) fuv.setXY(i, (fpa.getX(i) + a) / (2 * a), (fpa.getZ(i) + b) / (2 * b));
  const floorMat = new THREE.MeshStandardMaterial({ map: floorTexture(arena, theme, colors), roughness: arena.mode === 'hoops' ? 0.45 : 0.85, metalness: arena.mode === 'dropshot' ? 0.4 : 0 });
  const floor = new THREE.Mesh(floorGeo, floorMat);
  floor.receiveShadow = true;

  // ceiling (faint)
  const cshape = new THREE.Shape();
  cols.forEach((c, i) => { const x = c.x - c.nx * c.r, z = c.z - c.nz * c.r; if (i) cshape.lineTo(x, -z); else cshape.moveTo(x, -z); });
  const ceil = new THREE.Mesh(new THREE.ShapeGeometry(cshape).rotateX(-Math.PI / 2).translate(0, H, 0),
    new THREE.MeshBasicMaterial({ color: theme.accent, transparent: true, opacity: 0.035, side: THREE.DoubleSide, depthWrite: false }));

  return { shell, shellMat, floor, floorMat, ceil, trims, cols };
}

// ------------------------------------------------------------------ Soccar goals
function filletCap(r, x, zWall, s, theme) {
  // the solid between the back-wall floor fillet and the wall corner, seen side-on at a post
  const pts = [], K = 9;
  for (let i = 0; i <= K; i++) { const th = (Math.PI / 2) * i / K; pts.push([r - r * Math.sin(th), r - r * Math.cos(th)]); }
  const verts = [x, 0, zWall];
  for (const [d, y] of pts) verts.push(x, y, zWall - s * d);
  const idx = [];
  for (let i = 1; i < pts.length; i++) idx.push(0, i, i + 1);
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(verts, 3));
  geo.setIndex(idx); geo.computeVertexNormals();
  return new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ color: new THREE.Color(theme.floor2), side: THREE.DoubleSide, roughness: 0.9 }));
}

function buildGoals(arena, theme, colors, group) {
  const p = arena.p, b = arena.halfL, gw = arena.goalHalfW, gh = p.goalHeight, depth = p.goalDepth;
  const z0 = arena.goalZ0;
  for (const team of [0, 1]) {
    const s = team === 0 ? -1 : 1, col = colors[team];
    const g = new THREE.Group();
    const netMat = new THREE.MeshStandardMaterial({ map: netTexture(col.css), transparent: true, side: THREE.DoubleSide, emissive: new THREE.Color(col.main), emissiveIntensity: 0.25, depthWrite: false, roughness: 0.6 });
    netMat.map.repeat.set(4, 2);
    const back = new THREE.Mesh(new THREE.PlaneGeometry(2 * gw, gh), netMat); back.position.set(0, gh / 2, s * (b + depth));
    const roof = new THREE.Mesh(new THREE.PlaneGeometry(2 * gw, depth), netMat); roof.rotation.x = Math.PI / 2; roof.position.set(0, gh, s * (b + depth / 2));
    const left = new THREE.Mesh(new THREE.PlaneGeometry(depth, gh), netMat); left.rotation.y = Math.PI / 2; left.position.set(-gw, gh / 2, s * (b + depth / 2));
    const right = left.clone(); right.position.x = gw;
    // goal floor runs from where the back-wall fillet would start, so the mouth is flush
    const flen = b + depth - z0;
    const gfloor = new THREE.Mesh(new THREE.PlaneGeometry(2 * gw, flen), new THREE.MeshStandardMaterial({ color: new THREE.Color(col.dark), roughness: 0.8, emissive: new THREE.Color(col.main), emissiveIntensity: 0.1 }));
    gfloor.rotation.x = -Math.PI / 2; gfloor.position.set(0, 0.004, s * (z0 + flen / 2));
    g.add(back, roof, left, right, gfloor);
    const frameMat = new THREE.MeshStandardMaterial({ color: col.light, emissive: new THREE.Color(col.main), emissiveIntensity: 1.6, roughness: 0.3 });
    const postGeo = new THREE.CylinderGeometry(0.22, 0.22, gh, 12);
    for (const x of [-gw, gw]) { const post = new THREE.Mesh(postGeo, frameMat); post.position.set(x, gh / 2, s * b); g.add(post); }
    const bar = new THREE.Mesh(new THREE.CylinderGeometry(0.22, 0.22, 2 * gw + 0.44, 12), frameMat); bar.rotation.z = Math.PI / 2; bar.position.set(0, gh, s * b); g.add(bar);
    for (const x of [-gw, gw]) g.add(filletCap(arena.rEnd, x, s * b, s, theme));
    const light = new THREE.PointLight(col.main, 60, 40, 1.6); light.position.set(0, gh * 0.8, s * (b - 2)); light.userData.dynamic = true; g.add(light);
    mergeByMaterial(g);
    group.add(g);
  }
}

// ------------------------------------------------------------------ Hoops furniture
function backboardTexture(col) {
  const [c, g] = canvas(256, 160);
  const grd = g.createLinearGradient(0, 0, 0, 160);
  grd.addColorStop(0, 'rgba(255,255,255,0.28)'); grd.addColorStop(1, 'rgba(255,255,255,0.12)');
  g.fillStyle = grd; g.fillRect(0, 0, 256, 160);
  g.strokeStyle = 'rgba(255,255,255,0.95)'; g.lineWidth = 8; g.strokeRect(4, 4, 248, 152);
  g.strokeStyle = col; g.lineWidth = 7; g.strokeRect(84, 62, 88, 64);
  return tex(c);
}

function buildHoops(arena, theme, colors, group) {
  const b = arena.halfL, rimY = arena.rimY;
  for (const team of [0, 1]) {
    const s = team === 0 ? -1 : 1, col = colors[team], z = s * arena.hoopZ;
    const g = new THREE.Group();
    const rimMat = new THREE.MeshStandardMaterial({ color: col.light, emissive: new THREE.Color(col.main), emissiveIntensity: 1.3, metalness: 0.6, roughness: 0.3 });
    const rim = new THREE.Mesh(new THREE.TorusGeometry(arena.rimR, HOOPS.rimTube, 12, 64), rimMat);
    rim.rotation.x = Math.PI / 2; rim.position.set(0, rimY, z);
    const netMat = new THREE.MeshStandardMaterial({ map: netTexture('#f8fafc'), transparent: true, side: THREE.DoubleSide, emissive: new THREE.Color(col.main), emissiveIntensity: 0.2, depthWrite: false });
    netMat.map.repeat.set(10, 2);
    const net = new THREE.Mesh(new THREE.CylinderGeometry(arena.rimR, arena.rimR * 0.62, HOOPS.netDepth, 32, 3, true), netMat);
    net.position.set(0, rimY - HOOPS.netDepth / 2, z);
    // backboard on the back wall and the bracket holding the rim
    const bw = 2 * arena.rimR + 6, bh = 4.4;
    const board = new THREE.Mesh(new THREE.PlaneGeometry(bw, bh), new THREE.MeshBasicMaterial({ map: backboardTexture(col.css), transparent: true, side: THREE.DoubleSide, depthWrite: false }));
    board.position.set(0, rimY + 1.6, s * (b - 0.08)); board.rotation.y = s > 0 ? Math.PI : 0;
    board.userData.dynamic = true;
    const blen = b - (arena.hoopZ + arena.rimR);
    const bracketMat = new THREE.MeshStandardMaterial({ color: 0x9ca3af, metalness: 0.7, roughness: 0.35 });
    const bracket = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.25, blen + 0.2), bracketMat);
    bracket.position.set(0, rimY, s * (arena.hoopZ + arena.rimR + blen / 2));
    // glowing ring on the floor under the hoop
    const ring = new THREE.Mesh(new THREE.RingGeometry(arena.rimR - 0.25, arena.rimR + 0.05, 48).rotateX(-Math.PI / 2), new THREE.MeshBasicMaterial({ color: col.main, transparent: true, opacity: 0.55, depthWrite: false }));
    ring.position.set(0, 0.012, z); ring.userData.dynamic = true;
    const light = new THREE.PointLight(col.main, 50, 30, 1.6); light.position.set(0, rimY + 3, z - s * 3); light.userData.dynamic = true;
    g.add(rim, net, board, bracket, ring, light);
    mergeByMaterial(g);
    group.add(g);
  }
}

// ------------------------------------------------------------------ Dropshot tiles
function tileTextures() {
  const S = 256, mid = S / 2;
  const hexPath = (g, r) => { g.beginPath(); for (let i = 0; i < 6; i++) { const a = Math.PI / 2 + (i * Math.PI) / 3; g.lineTo(mid + Math.cos(a) * r, mid + Math.sin(a) * r); } g.closePath(); };
  // diffuse: brushed panel, lighter towards the rim
  const [c1, g1] = canvas(S, S);
  const rg = g1.createRadialGradient(mid, mid, 10, mid, mid, mid);
  rg.addColorStop(0, '#6b7280'); rg.addColorStop(0.75, '#9ca3af'); rg.addColorStop(1, '#d1d5db');
  g1.fillStyle = rg; g1.fillRect(0, 0, S, S);
  g1.strokeStyle = 'rgba(0,0,0,0.25)'; g1.lineWidth = 3; hexPath(g1, mid * 0.55); g1.stroke();
  // emissive: bright rim with a soft inner falloff and an inner hex line
  const [c2, g2] = canvas(S, S);
  g2.fillStyle = '#000'; g2.fillRect(0, 0, S, S);
  for (let k = 0; k < 10; k++) { g2.strokeStyle = `rgba(255,255,255,${0.09 * (10 - k) / 10})`; g2.lineWidth = 4; hexPath(g2, mid * 0.98 - k * 4); g2.stroke(); }
  g2.strokeStyle = '#fff'; g2.lineWidth = 6; hexPath(g2, mid * 0.97); g2.stroke();
  g2.strokeStyle = 'rgba(255,255,255,0.45)'; g2.lineWidth = 3; hexPath(g2, mid * 0.55); g2.stroke();
  // hole: black core, glowing edge
  const [c3, g3] = canvas(S, S);
  const hg = g3.createRadialGradient(mid, mid, 0, mid, mid, mid);
  hg.addColorStop(0, '#000'); hg.addColorStop(0.7, '#000'); hg.addColorStop(0.92, '#555'); hg.addColorStop(1, '#fff');
  g3.fillStyle = hg; g3.fillRect(0, 0, S, S);
  return { map: tex(c1), glow: tex(c2), hole: tex(c3) };
}

function buildTiles(arena, colors, group) {
  const R = DROPSHOT.tileRadius, tiles = arena.tiles, n = tiles.length;
  const T = tileTextures();
  const geo = new THREE.CylinderGeometry(R * 0.955, R * 0.955, 0.3, 6, 1, false, Math.PI / 2).translate(0, -0.15 + 0.012, 0);
  const mat = new THREE.MeshStandardMaterial({ map: T.map, emissive: 0xffffff, emissiveMap: T.glow, emissiveIntensity: 1, roughness: 0.35, metalness: 0.45 });
  // per-instance colour also tints the glow
  mat.onBeforeCompile = (sh) => { sh.fragmentShader = sh.fragmentShader.replace('#include <emissivemap_fragment>', '#include <emissivemap_fragment>\n#ifdef USE_COLOR\ntotalEmissiveRadiance *= vColor;\n#endif'); };
  const mesh = new THREE.InstancedMesh(geo, mat, n);
  mesh.receiveShadow = true;
  const holeGeo = new THREE.CircleGeometry(R * 0.955, 6).rotateX(-Math.PI / 2);
  // CircleGeometry's uv is planar, so a radial texture reads as a dark pit with a lit edge
  const holes = new THREE.InstancedMesh(holeGeo, new THREE.MeshBasicMaterial({ map: T.hole }), n);
  const m = new THREE.Matrix4(), q = new THREE.Quaternion(), v = new THREE.Vector3(), s = new THREE.Vector3(), c = new THREE.Color();
  const intact = colors.map((cl) => new THREE.Color(cl.main).multiplyScalar(0.55));
  const damaged = colors.map((cl) => new THREE.Color(cl.light).multiplyScalar(1.6));
  let last = '';
  const update = (states, t = 0) => {
    const key = states ? states.join('') : '';
    if (key === last && !(states && states.includes(1))) return;
    last = key;
    for (let i = 0; i < n; i++) {
      const tl = tiles[i], st = states ? states[i] : 0;
      m.compose(v.set(tl.x, 0, tl.z), q, s.setScalar(st >= 2 ? 0 : 1)); mesh.setMatrixAt(i, m);
      if (st === 1) c.copy(damaged[tl.team]).multiplyScalar(0.8 + 0.2 * Math.sin(t * 8 + i)); else c.copy(intact[tl.team]);
      mesh.setColorAt(i, c);
      m.compose(v.set(tl.x, 0.014, tl.z), q, s.setScalar(st >= 2 ? 1 : 0)); holes.setMatrixAt(i, m);
      holes.setColorAt(i, c.set(colors[tl.team].light));
    }
    mesh.instanceMatrix.needsUpdate = true; holes.instanceMatrix.needsUpdate = true;
    mesh.instanceColor.needsUpdate = true; holes.instanceColor.needsUpdate = true;
  };
  update(null);
  group.add(mesh, holes);
  return update;
}

// ------------------------------------------------------------------ surroundings
function skyDome(theme) {
  const s = theme.sky;
  const sunDir = new THREE.Vector3(...(s.sun || [0, -1, 0])).normalize();
  const mat = new THREE.ShaderMaterial({
    side: THREE.BackSide, depthWrite: false, fog: false,
    uniforms: {
      top: { value: new THREE.Color(s.top) }, horizon: { value: new THREE.Color(s.horizon) }, bottom: { value: new THREE.Color(s.bottom) },
      sunDir: { value: sunDir }, sunColor: { value: new THREE.Color(s.sunColor || 0) }, sunSize: { value: s.sun ? s.sunSize || 1 : 0 },
    },
    vertexShader: 'varying vec3 vDir; void main(){ vDir = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }',
    fragmentShader: `uniform vec3 top; uniform vec3 horizon; uniform vec3 bottom; uniform vec3 sunDir; uniform vec3 sunColor; uniform float sunSize; varying vec3 vDir;
      void main(){ vec3 d = normalize(vDir); float h = d.y;
        vec3 c = h > 0.0 ? mix(horizon, top, pow(smoothstep(0.0, 1.0, h), 0.55)) : mix(horizon, bottom, smoothstep(0.0, 0.2, -h));
        float s = max(dot(d, sunDir), 0.0);
        c += sunColor * (step(0.9993, s) * 3.0 * sign(sunSize) + pow(s, 14.0) * 0.4 * sunSize + pow(s, 3.0) * 0.12 * sunSize);
        gl_FragColor = vec4(c, 1.0);
        #include <tonemapping_fragment>
        #include <colorspace_fragment>
      }`,
  });
  const m = new THREE.Mesh(new THREE.SphereGeometry(800, 48, 24), mat);
  m.renderOrder = -10; m.frustumCulled = false; m.userData.dynamic = true;
  return m;
}

// outer plan edges with outward normals (for stands, boards, screens)
function planEdges(arena) {
  const o = arena.outer, out = [];
  for (let i = 0; i < o.length; i++) {
    const [ax, az] = o[i], [bx, bz] = o[(i + 1) % o.length];
    const ex = bx - ax, ez = bz - az, len = Math.hypot(ex, ez);
    out.push({ mx: (ax + bx) / 2, mz: (az + bz) / 2, len, nx: ez / len, nz: -ex / len, end: Math.abs(-ex / len) > 0.99 });
  }
  return out;
}

function ledTexture(colors, text) {
  const [c, g] = canvas(512, 64);
  const grd = g.createLinearGradient(0, 0, 512, 0);
  grd.addColorStop(0, colors[0].css); grd.addColorStop(0.5, '#0b1020'); grd.addColorStop(1, colors[1].css);
  g.fillStyle = grd; g.fillRect(0, 0, 512, 64);
  g.fillStyle = 'rgba(255,255,255,0.92)'; g.font = 'italic 700 34px "Chakra Petch", system-ui, sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle';
  g.fillText(text, 256, 34);
  g.fillStyle = 'rgba(0,0,0,0.25)'; for (let y = 0; y < 64; y += 3) g.fillRect(0, y, 512, 1);
  return tex(c, { repeat: true });
}

function screenTexture(name, colors) {
  const [c, g] = canvas(512, 192);
  const grd = g.createLinearGradient(0, 0, 512, 192);
  grd.addColorStop(0, '#050816'); grd.addColorStop(1, '#141c36');
  g.fillStyle = grd; g.fillRect(0, 0, 512, 192);
  g.fillStyle = colors[0].css; g.fillRect(0, 0, 256, 10); g.fillStyle = colors[1].css; g.fillRect(256, 0, 256, 10);
  g.fillStyle = '#f8fafc'; g.font = 'italic 800 56px "Chakra Petch", system-ui, sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle';
  g.fillText('OVERDRIVE', 256, 88);
  g.fillStyle = 'rgba(203,213,225,0.85)'; g.font = '600 24px "Chakra Petch", system-ui, sans-serif'; g.fillText(name.toUpperCase(), 256, 146);
  return tex(c);
}

function buildStands(arena, theme, colors, quality, group) {
  const g = new THREE.Group();
  const H = arena.p.height, tiers = theme.tiers || 7;
  const standMat = new THREE.MeshStandardMaterial({ color: theme.standColor, roughness: 0.85 });
  const edgeMat = new THREE.MeshStandardMaterial({ color: theme.standColor, emissive: new THREE.Color(theme.accent), emissiveIntensity: 0.35, roughness: 0.6 });
  const led = new THREE.MeshBasicMaterial({ map: ledTexture(colors, 'OVERDRIVE  ·  OVERDRIVE') });
  const crowd = [];
  for (const e of planEdges(arena)) {
    const d0 = 3.5 + (arena.mode === 'soccar' && e.end ? arena.p.goalDepth : 0);
    const len = e.len + 14;
    const grp = new THREE.Group();
    for (let t = 0; t < tiers; t++) {
      const step = new THREE.Mesh(new THREE.BoxGeometry(3, 1.6, len + t * 3), standMat);
      step.position.set(d0 + 1.5 + t * 3, 0.8 + t * 2.4, 0); grp.add(step);
      const lip = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.12, len + t * 3), edgeMat);
      lip.position.set(d0 + t * 3 + 0.05, 1.62 + t * 2.4, 0); grp.add(lip);
      for (let k = -len / 2 + 1; k < len / 2 - 1; k += 1.4) crowd.push({ grp, x: d0 + 1.2 + t * 3, y: 2.2 + t * 2.4, z: k + (Math.random() - 0.5) * 0.4 });
    }
    // LED advertising board in front of the first tier
    const board = new THREE.Mesh(new THREE.PlaneGeometry(len, 1.1), led.clone());
    board.material.map = led.map.clone(); board.material.map.repeat.set(Math.max(1, Math.round(len / 18)), 1); board.material.map.needsUpdate = true;
    board.position.set(d0 - 0.05, 0.75, 0); board.rotation.y = -Math.PI / 2; board.userData.dynamic = true;
    grp.add(board);
    if (theme.surround.includes('roof')) {
      const roof = new THREE.Mesh(new THREE.BoxGeometry(tiers * 3 + 6, 0.5, len + tiers * 3), new THREE.MeshStandardMaterial({ color: theme.roofColor, roughness: 0.7 }));
      roof.position.set(d0 + tiers * 1.5 + 1, tiers * 2.4 + 7, 0); roof.rotation.z = 0.12; grp.add(roof);
      const strip = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.2, len + tiers * 3), new THREE.MeshBasicMaterial({ color: 0xf8fafc }));
      strip.position.set(d0 - 1.5, tiers * 2.4 + 6.3, 0); grp.add(strip);
    }
    grp.position.set(e.mx, 0, e.mz); grp.rotation.y = Math.atan2(-e.nz, e.nx);
    g.add(grp);
  }
  // crowd as one instanced mesh, fans lean towards the team at their end
  const n = quality === 'low' ? Math.floor(crowd.length / 3) : crowd.length;
  const inst = new THREE.InstancedMesh(new THREE.BoxGeometry(0.6, 1.1, 0.6), new THREE.MeshStandardMaterial({ roughness: 1 }), n);
  const m = new THREE.Matrix4(), q = new THREE.Quaternion(), sc = new THREE.Vector3(), v = new THREE.Vector3(), c = new THREE.Color();
  const palette = [0xe5e7eb, 0x9ca3af, 0x374151];
  g.updateMatrixWorld(true);
  for (let i = 0; i < n; i++) {
    const cp = crowd[Math.floor((i * crowd.length) / n)];
    v.set(cp.x, cp.y, cp.z).applyMatrix4(cp.grp.matrixWorld);
    sc.set(1, 0.8 + Math.random() * 0.4, 1);
    m.compose(v, q, sc); inst.setMatrixAt(i, m);
    const zside = v.z > 10 ? 1 : v.z < -10 ? 0 : -1;
    let col = palette[Math.floor(Math.random() * 3)];
    if (zside >= 0 && Math.random() < 0.6) col = Math.random() < 0.5 ? colors[zside].main : colors[zside].light;
    inst.setColorAt(i, c.set(col));
  }
  mergeByMaterial(g);
  g.add(inst);
  group.add(g);
  void H;
}

function buildTowers(arena, theme, group) {
  const g = new THREE.Group();
  const H = arena.p.height;
  const poleMat = new THREE.MeshStandardMaterial({ color: 0x374151, metalness: 0.6, roughness: 0.4 });

  for (const [sx, sz] of [[-1, -1], [1, -1], [-1, 1], [1, 1]]) {

    const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.5, 0.9, hgt, 8), poleMat); pole.position.set(x, hgt / 2, z); g.add(pole);
    const head = new THREE.Group(); head.position.set(x, hgt, z); head.lookAt(0, 0, 0);
    const panel = new THREE.Mesh(new THREE.BoxGeometry(7, 4, 0.5), headMat); head.add(panel);
    const back = new THREE.Mesh(new THREE.BoxGeometry(7.4, 4.4, 0.6), poleMat); back.position.z = -0.4; head.add(back);

function buildScreens(arena, theme, colors, group) {

    group.add(scr, fr);
  }
}

function rand(seed) { let s = seed >>> 0; return () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; }; }

function buildCity(arena, theme, quality, group) {
  const cfg = theme.city || { near: 100, far: 240, hMin: 25, hMax: 110, glow: 0xffd28a };
  const [c, g] = canvas(64, 128);
  g.fillStyle = '#05070d'; g.fillRect(0, 0, 64, 128);
  const r = rand(7);
  for (let y = 2; y < 128; y += 6) for (let x = 2; x < 64; x += 6) if (r() < 0.45) { g.fillStyle = r() < 0.75 ? '#ffd9a0' : '#9be7ff'; g.globalAlpha = 0.5 + r() * 0.5; g.fillRect(x, y, 3, 3); }
  g.globalAlpha = 1;
  const t = tex(c, { repeat: true }); t.repeat.set(2, 3);
  const mat = new THREE.MeshStandardMaterial({ color: 0x1c2230, map: t, emissive: new THREE.Color(cfg.glow), emissiveMap: t, emissiveIntensity: 1.1, roughness: 0.6, metalness: 0.3 });
  const n = quality === 'low' ? 70 : 190;
  const inst = new THREE.InstancedMesh(new THREE.BoxGeometry(1, 1, 1).translate(0, 0.5, 0), mat, n);
  const m = new THREE.Matrix4(), q = new THREE.Quaternion(), v = new THREE.Vector3(), s = new THREE.Vector3();
  for (let i = 0; i < n; i++) {
    const ang = (i / n) * Math.PI * 2 + r() * 0.05, d = cfg.near + r() * (cfg.far - cfg.near);
    const h = cfg.hMin + Math.pow(r(), 1.6) * (cfg.hMax - cfg.hMin);
    q.setFromAxisAngle(v.set(0, 1, 0), ang);
    m.compose(v.set(Math.sin(ang) * d, -6, Math.cos(ang) * d), q, s.set(8 + r() * 16, h, 8 + r() * 16));
    inst.setMatrixAt(i, m);
  }
  group.add(inst);
  // rooftop beacons
  const bp = [];
  for (let i = 0; i < 40; i++) { const ang = r() * Math.PI * 2, d = cfg.near + r() * (cfg.far - cfg.near); bp.push(Math.sin(ang) * d, cfg.hMin + r() * (cfg.hMax - cfg.hMin), Math.cos(ang) * d); }
  const bg = new THREE.BufferGeometry(); bg.setAttribute('position', new THREE.Float32BufferAttribute(bp, 3));
  group.add(new THREE.Points(bg, new THREE.PointsMaterial({ color: 0xff4d6d, size: 3, sizeAttenuation: false })));
}

function buildDunes(group) {
  const geo = new THREE.PlaneGeometry(1600, 1600, 160, 160).rotateX(-Math.PI / 2);

  for (let i = 0; i < p.count; i++) {
    const x = p.getX(i), z = p.getZ(i), d = Math.hypot(x, z);
    const k = Math.min(1, Math.max(0, (d - 90) / 80));
    const h = (Math.sin(x * 0.021 + Math.cos(z * 0.013) * 2) * 9 + Math.sin(z * 0.033 + x * 0.008) * 5 + Math.sin((x + z) * 0.06) * 1.5 + 8) * k;
    p.setY(i, h - 0.1);

  geo.computeVertexNormals();
  group.add(new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ color: 0xd59a5c, roughness: 1 })));
}

function buildMesas(group) {
  const r = rand(3);
  const g = new THREE.Group();
  const mat = new THREE.MeshStandardMaterial({ color: 0xa4552f, roughness: 1, flatShading: true });
  const top = new THREE.MeshStandardMaterial({ color: 0xc77a45, roughness: 1, flatShading: true });
  for (let i = 0; i < 12; i++) {

    const z = catmull(zs, t), b = catmull(bot, t), tp = catmull(top, t), w = Math.max(0.02, catmull(hw, t));
    secs.push({ z, ring: ring((b + tp) / 2, Math.max(0.01, (tp - b) / 2), w, def.round, M) });
  }
  return loft(secs);
}

function cabinShell(def, sectionsN = 14, M = 24) {
  const st = def.cabin;
  const secs = [];
  for (let k = 0; k < sectionsN; k++) {
    const t = (k / (sectionsN - 1)) * (st.length - 1);
    const z = catmull(st.map((s) => s[0]), t), b = catmull(st.map((s) => s[1]), t), r = catmull(st.map((s) => s[2]), t);
    const bw = catmull(st.map((s) => s[3]), t), tw = catmull(st.map((s) => s[4]), t);
    secs.push({ z, ring: ring((b + r) / 2, Math.max(0.005, (r - b) / 2), bw, 3, M, (y01) => bw + (tw - bw) * y01) });
  }
  return loft(secs);
}

function paintMaterial(color, finish) {
  if (finish === 'pearl') return new THREE.MeshPhysicalMaterial({ color, roughness: 0.22, metalness: 0.35, clearcoat: 1, clearcoatRoughness: 0.06, iridescence: 1, iridescenceIOR: 1.6, iridescenceThicknessRange: [200, 900] });
  if (finish === 'metal') return new THREE.MeshPhysicalMaterial({ color, roughness: 0.3, metalness: 0.85, clearcoat: 0.6, clearcoatRoughness: 0.2 });
  if (finish === 'matte') return new THREE.MeshStandardMaterial({ color, roughness: 0.78, metalness: 0.05 });
  return new THREE.MeshPhysicalMaterial({ color, roughness: 0.18, metalness: 0.08, clearcoat: 1, clearcoatRoughness: 0.08 });
}

let _shared = null;
function shared() {
  if (_shared) return _shared;
  const tread = (() => {
    const c = document.createElement('canvas'); c.width = 64; c.height = 256;
    const g = c.getContext('2d');
    g.fillStyle = '#17181c'; g.fillRect(0, 0, 64, 256);
    g.fillStyle = '#0b0c0f';
    for (let y = 0; y < 256; y += 16) { g.fillRect(6, y, 22, 7); g.fillRect(36, y + 8, 22, 7); }
    g.fillRect(30, 0, 4, 256);
    const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.colorSpace = THREE.SRGBColorSpace;
    return t;
  })();
  _shared = {
    rubber: new THREE.MeshStandardMaterial({ color: 0xffffff, map: tread, roughness: 0.92, metalness: 0 }),
    sidewall: new THREE.MeshStandardMaterial({ color: 0x1b1c20, roughness: 0.85 }),
    trim: new THREE.MeshPhysicalMaterial({ color: 0x0d0f14, roughness: 0.35, metalness: 0.3, clearcoat: 0.5 }),
    carbon: new THREE.MeshStandardMaterial({ color: 0x17191f, roughness: 0.55, metalness: 0.4 }),
    glass: new THREE.MeshPhysicalMaterial({ color: 0x070b14, roughness: 0.05, metalness: 0.2, clearcoat: 1, clearcoatRoughness: 0.02 }),
    disc: new THREE.MeshStandardMaterial({ color: 0x55585f, roughness: 0.45, metalness: 0.85 }),
    nozzle: new THREE.MeshStandardMaterial({ color: 0x2a2d33, roughness: 0.3, metalness: 0.9 }),
    head: new THREE.MeshStandardMaterial({ color: 0xffffff, emissive: 0xe8f1ff, emissiveIntensity: 2.2, roughness: 0.2 }),
    tail: new THREE.MeshStandardMaterial({ color: 0x400000, emissive: 0xff1f2e, emissiveIntensity: 2.0, roughness: 0.3 }),
  };
  return _shared;
}

// Tyre with rounded shoulders (lathe) + tread texture, rim with depth, brake disc, caliper.
function buildWheel(style, r, rimColor, teamCol, width = 0.17) {
  const S = shared();
  const g = new THREE.Group();
  const spin = new THREE.Group();
  const hw = width / 2, sh = 0.035;
  const prof = [];
  const inner = r * 0.66;
  prof.push(new THREE.Vector2(inner, -hw));
  for (let i = 0; i <= 6; i++) { const a = -Math.PI / 2 + (i / 6) * (Math.PI / 2); prof.push(new THREE.Vector2(r - sh + Math.cos(a) * sh, -hw + sh + Math.sin(a) * sh)); }
  for (let i = 0; i <= 6; i++) { const a = (i / 6) * (Math.PI / 2); prof.push(new THREE.Vector2(r - sh + Math.cos(a) * sh, hw - sh + Math.sin(a) * sh)); }
  prof.push(new THREE.Vector2(inner, hw));
  const tyreGeo = new THREE.LatheGeometry(prof, 32);
  tyreGeo.rotateZ(Math.PI / 2); // lathe axis Y -> X (axle)
  const tyre = new THREE.Mesh(tyreGeo, S.rubber);
  S.rubber.map.repeat.set(1, 3);
  spin.add(tyre);
  const rimMat = new THREE.MeshStandardMaterial({ color: rimColor, roughness: 0.22, metalness: 0.92 });
  // rim barrel (open cylinder) and face
  const barrel = new THREE.Mesh(new THREE.CylinderGeometry(inner, inner, width * 0.9, 28, 1, true), rimMat);
  barrel.rotation.z = Math.PI / 2; spin.add(barrel);
  const lip = new THREE.Mesh(new THREE.TorusGeometry(inner, 0.012, 6, 28), rimMat);
  for (const s of [-1, 1]) { const l = lip.clone(); l.rotation.y = Math.PI / 2; l.position.x = s * width * 0.45; spin.add(l); }
  const face = new THREE.Group(); face.position.x = width * 0.36;
  const hub = new THREE.Mesh(new THREE.CylinderGeometry(r * 0.16, r * 0.18, 0.03, 16), rimMat); hub.rotation.z = Math.PI / 2; face.add(hub);
  const cap = new THREE.Mesh(new THREE.CylinderGeometry(r * 0.08, r * 0.08, 0.035, 12), new THREE.MeshStandardMaterial({ color: teamCol, metalness: 0.5, roughness: 0.3 }));
  cap.rotation.z = Math.PI / 2; cap.position.x = 0.005; face.add(cap);
  if (style === 'disc') {
    const d = new THREE.Mesh(new THREE.CylinderGeometry(inner * 0.97, inner * 0.97, 0.012, 32), rimMat); d.rotation.z = Math.PI / 2; face.add(d);
    for (let i = 0; i < 5; i++) { const a = (i / 5) * Math.PI * 2; const h = new THREE.Mesh(new THREE.CylinderGeometry(0.018, 0.018, 0.016, 8), S.trim); h.rotation.z = Math.PI / 2; h.position.set(0.002, Math.cos(a) * inner * 0.6, Math.sin(a) * inner * 0.6); face.add(h); }
  } else if (style === 'halo') {
    const ringG = new THREE.Mesh(new THREE.TorusGeometry(inner * 0.75, 0.012, 6, 28), new THREE.MeshBasicMaterial({ color: teamCol }));
    ringG.rotation.y = Math.PI / 2; face.add(ringG);
    for (let i = 0; i < 4; i++) { const sp = new THREE.Mesh(new THREE.BoxGeometry(0.014, inner * 0.95, 0.03), rimMat); sp.rotation.x = (i / 4) * Math.PI; face.add(sp); }
  } else {
    const n = style === 'tri' ? 3 : style === 'turbine' ? 10 : style === 'mesh' ? 14 : 6;
    for (let i = 0; i < n; i++) {
      const a = (i / n) * Math.PI * 2;
      const len = inner * 0.85;
      const sp = new THREE.Mesh(new THREE.BoxGeometry(style === 'turbine' ? 0.01 : 0.02, len, style === 'tri' ? 0.07 : style === 'mesh' ? 0.012 : 0.032), rimMat);
      sp.position.set(-0.004, Math.cos(a) * len / 2, Math.sin(a) * len / 2);
      sp.rotation.x = -a;
      if (style === 'turbine') sp.rotation.y = 0.5;
      face.add(sp);
      if (style === 'mesh' && i % 2 === 0) { const cr = sp.clone(); cr.rotation.x = -a + 0.5; face.add(cr); }
    }
  }
  spin.add(face);
  g.add(spin);
  // brake disc and caliper do not spin
  const disc = new THREE.Mesh(new THREE.CylinderGeometry(inner * 0.78, inner * 0.78, 0.014, 24), S.disc);
  disc.rotation.z = Math.PI / 2; disc.position.x = width * 0.12; g.add(disc);
  const caliper = new THREE.Mesh(new THREE.BoxGeometry(0.03, inner * 0.42, inner * 0.3), new THREE.MeshStandardMaterial({ color: teamCol, roughness: 0.35, metalness: 0.4 }));
  caliper.position.set(width * 0.2, inner * 0.5, -inner * 0.2); g.add(caliper);
  g.userData.spin = spin;
  return g;
}

function fender(r, width, paint) {
  // half-torus arch over a wheel, slightly wider than the tyre
  const geo = new THREE.TorusGeometry(r + 0.03, 0.03, 8, 22, Math.PI);
  geo.scale(1, 1, (width + 0.05) / 0.06);
  geo.rotateY(Math.PI / 2);
  return new THREE.Mesh(geo, paint);
}

function glowTexture() {
  if (glowTexture.t) return glowTexture.t;
  const c = document.createElement('canvas'); c.width = c.height = 128;
  const g = c.getContext('2d');
  const grd = g.createRadialGradient(64, 64, 4, 64, 64, 62);
  grd.addColorStop(0, 'rgba(255,255,255,1)'); grd.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = grd; g.fillRect(0, 0, 128, 128);
  glowTexture.t = new THREE.CanvasTexture(c);
  return glowTexture.t;
}


function buildCar(cosIn, teamColor, opts = {}) {
  const cos = { ...DEFAULT_LOADOUT, ...(cosIn || {}) };
  const def = BODIES[cos.body] || BODIES.strider;
  const S = shared();
  const team = new THREE.Color(teamColor.main);
  const root = new THREE.Group();
  const body = new THREE.Group();
  root.add(body);
  const paint = paintMaterial(new THREE.Color(cos.paint), cos.finish);
  const accent = paintMaterial(new THREE.Color(cos.accent), cos.finish === 'pearl' ? 'gloss' : cos.finish);
  const teamMat = new THREE.MeshStandardMaterial({ color: team, emissive: team, emissiveIntensity: 1.1, roughness: 0.4 });

  // ---- shell + glasshouse
  const shellGeo = bodyShell(def);
  const shell = new THREE.Mesh(shellGeo, paint);
  shell.castShadow = true;
  body.add(shell);
  if (def.openWheel) {
    const cabin = new THREE.Mesh(cabinShell(def), S.glass); cabin.castShadow = true; body.add(cabin);
  } else {
    // painted roof and pillars, with a tinted glass band wrapped around below the roof line
    const roofShell = new THREE.Mesh(cabinShell(def), cos.decal === 'split' ? accent : paint);
    roofShell.castShadow = true; body.add(roofShell);
    const band = { ...def, cabin: def.cabin.map(([z, b, r, bw, tw]) => [z + (z > 0 ? 0.012 : -0.012), b + 0.01, b + (r - b) * 0.84, bw + 0.012, bw + (tw - bw) * 0.84 + 0.012]) };
    body.add(new THREE.Mesh(cabinShell(band), S.glass));
  }
  const frontZ = def.stations[0][0], rearZ = def.stations[def.stations.length - 1][0];
  const halfW = Math.max(...def.stations.map((s) => s[3]));

  // ---- under-tray, splitter, diffuser
  const tray = new THREE.Mesh(new THREE.BoxGeometry(halfW * 1.3, 0.03, (frontZ - rearZ) * 0.7), S.carbon);
  tray.position.set(0, -0.2, (frontZ + rearZ) / 2); body.add(tray);
  if (!def.openWheel) {
    const split = new THREE.Mesh(new THREE.BoxGeometry(halfW * 1.35, 0.018, 0.07), S.carbon); split.position.set(0, -0.2, frontZ - 0.09); body.add(split);
    const diff = new THREE.Mesh(new THREE.BoxGeometry(halfW * 1.5, 0.05, 0.08), S.carbon); diff.position.set(0, -0.19, rearZ + 0.07); diff.rotation.x = -0.35; body.add(diff);
    for (let i = -2; i <= 2; i++) { const fin = new THREE.Mesh(new THREE.BoxGeometry(0.008, 0.06, 0.09), S.carbon); fin.position.set(i * 0.1, -0.18, rearZ + 0.06); body.add(fin); }
    // grille
    const grille = new THREE.Mesh(new THREE.BoxGeometry(halfW * 0.9, 0.05, 0.02), S.trim); grille.position.set(0, -0.12, frontZ - 0.035); body.add(grille);
  }

  // ---- lights
  const noseY = def.stations[1][2] - 0.02;
  for (const s of [-1, 1]) {
    const hl = new THREE.Mesh(new THREE.SphereGeometry(0.05, 14, 8), S.head);
    hl.scale.set(1.3, 0.38, 0.5); hl.position.set(s * (def.openWheel ? 0.08 : halfW * 0.62), noseY - 0.02, frontZ - 0.07); body.add(hl);
    const tl = new THREE.Mesh(new THREE.BoxGeometry(def.openWheel ? 0.05 : 0.14, 0.028, 0.02), S.tail);
    tl.position.set(s * (def.openWheel ? 0.07 : halfW * 0.6), def.stations[def.stations.length - 2][2] - 0.035, rearZ + 0.035); body.add(tl);
  }
  const tbar = new THREE.Mesh(new THREE.BoxGeometry(def.openWheel ? 0.12 : halfW * 0.7, 0.014, 0.02), teamMat);
  tbar.position.set(0, def.stations[def.stations.length - 2][2] - 0.065, rearZ + 0.03); body.add(tbar);

  // ---- team side stripes (lower body)
  if (!def.openWheel) for (const s of [-1, 1]) {
    const st = new THREE.Mesh(new THREE.BoxGeometry(0.008, 0.02, 0.36), teamMat);
    st.position.set(s * (halfW + 0.003), -0.12, 0); body.add(st);
  } else for (const s of [-1, 1]) {
    const pod = new THREE.Mesh(new THREE.CapsuleGeometry(0.07, 0.36, 4, 10), accent); pod.rotation.x = Math.PI / 2; pod.position.set(s * 0.25, -0.1, -0.12); pod.castShadow = true; body.add(pod);
    const st = new THREE.Mesh(new THREE.BoxGeometry(0.006, 0.02, 0.3), teamMat); st.position.set(s * 0.322, -0.1, -0.12); body.add(st);
  }


  // ---- aero per body
  const tailTop = def.stations[def.stations.length - 2][2];
  if (def.wing === 'high') {
    const wing = new THREE.Mesh(new THREE.BoxGeometry(halfW * 2 + 0.04, 0.02, 0.15), accent); wing.position.set(0, tailTop + 0.13, rearZ + 0.1); wing.rotation.x = 0.12; body.add(wing);
    for (const s of [-1, 1]) {
      const up = new THREE.Mesh(new THREE.BoxGeometry(0.02, 0.13, 0.06), S.carbon); up.position.set(s * halfW * 0.55, tailTop + 0.065, rearZ + 0.12); body.add(up);
      const ep = new THREE.Mesh(new THREE.BoxGeometry(0.012, 0.07, 0.17), accent); ep.position.set(s * (halfW + 0.03), tailTop + 0.14, rearZ + 0.1); body.add(ep);
    }
  } else if (def.wing === 'lip') {
    const lipW = new THREE.Mesh(new THREE.BoxGeometry(halfW * 1.8, 0.025, 0.07), accent); lipW.position.set(0, tailTop + 0.012, rearZ + 0.07); lipW.rotation.x = 0.35; body.add(lipW);
  } else if (def.wing === 'roof') {
    const rs = new THREE.Mesh(new THREE.BoxGeometry(halfW * 1.6, 0.02, 0.1), accent); rs.position.set(0, def.cabin[3][2] + 0.01, def.cabin[3][0] - 0.02); rs.rotation.x = 0.25; body.add(rs);
  } else if (def.wing === 'fin') {
    const sh = new THREE.Shape(); sh.moveTo(0.05, 0); sh.lineTo(-0.3, 0.17); sh.lineTo(-0.34, 0.17); sh.lineTo(-0.3, 0); sh.closePath();
    const fg = new THREE.ExtrudeGeometry(sh, { depth: 0.015, bevelEnabled: false }); fg.rotateY(-Math.PI / 2); fg.translate(0.0075, 0, 0);
    const fin = new THREE.Mesh(fg, accent); fin.position.set(0, tailTop - 0.01, rearZ + 0.38); body.add(fin);
  } else if (def.wing === 'formula') {
    const fw = new THREE.Mesh(new THREE.BoxGeometry(1.02, 0.02, 0.16), accent); fw.position.set(0, -0.2, frontZ - 0.03); body.add(fw);
    for (const s of [-1, 1]) { const ep = new THREE.Mesh(new THREE.BoxGeometry(0.012, 0.07, 0.18), accent); ep.position.set(s * 0.51, -0.17, frontZ - 0.03); body.add(ep); }
    const rw = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.03, 0.17), accent); rw.position.set(0, 0.26, rearZ + 0.02); rw.rotation.x = 0.15; body.add(rw);
    for (const s of [-1, 1]) { const ep = new THREE.Mesh(new THREE.BoxGeometry(0.014, 0.18, 0.2), accent); ep.position.set(s * 0.4, 0.2, rearZ + 0.02); body.add(ep); }
    const pyl = new THREE.Mesh(new THREE.BoxGeometry(0.03, 0.2, 0.06), S.carbon); pyl.position.set(0, 0.16, rearZ + 0.04); body.add(pyl);
    const intake = new THREE.Mesh(new THREE.CapsuleGeometry(0.06, 0.1, 4, 10), paint); intake.position.set(0, 0.2, -0.32); intake.scale.set(1, 1, 0.9); body.add(intake);
  }
  if (def.lightBar) {
    const bar = new THREE.Mesh(new THREE.BoxGeometry(0.42, 0.035, 0.04), S.trim); bar.position.set(0, def.cabin[1][2] + 0.035, def.cabin[1][0] - 0.03); body.add(bar);
    for (let i = -2; i <= 2; i++) { const l = new THREE.Mesh(new THREE.CylinderGeometry(0.018, 0.018, 0.01, 10), S.head); l.rotation.x = Math.PI / 2; l.position.set(i * 0.085, def.cabin[1][2] + 0.035, def.cabin[1][0] - 0.005); body.add(l); }
  }
  if (def.flaps) for (const s of [-1, 1]) { const f = new THREE.Mesh(new THREE.BoxGeometry(0.14, 0.11, 0.008), S.carbon); f.position.set(s * def.wheelX, GROUND + 0.1, def.wheelZ[1] - def.wheelR - 0.05); body.add(f); }
  if (def.glowLine) for (const s of [-1, 1]) { const gl = new THREE.Mesh(new THREE.BoxGeometry(0.006, 0.01, 0.95), teamMat); gl.position.set(s * (halfW + 0.002), -0.035, 0); body.add(gl); }

  // ---- decals
  if (cos.decal === 'stripe') {
    const sg = bodyShell({ ...def, stations: def.stations.map(([z, b, t, w]) => [z, b, t + 0.004, Math.min(w, def.openWheel ? 0.05 : 0.07)]) }, 30, 20);
    for (const s of [-1, 1]) { const m = new THREE.Mesh(sg, accent); m.position.x = s * (def.openWheel ? 0.0 : 0.11); m.scale.set(1, 1.015, 1.004); body.add(m); if (def.openWheel) break; }
  } else if (cos.decal === 'split') {
    const sg = bodyShell({ ...def, stations: def.stations.map(([z, b, t, w]) => [z, b - 0.003, Math.min(t, b + 0.07), w + 0.004]) });
    body.add(new THREE.Mesh(sg, accent));
  } else if (cos.decal === 'hex') {
    for (const s of [-1, 1]) for (let i = 0; i < 5; i++) {
      const hx = new THREE.Mesh(new THREE.CylinderGeometry(0.045, 0.045, 0.008, 6), accent);
      hx.rotation.z = Math.PI / 2; hx.position.set(s * (halfW + 0.004), -0.06 - (i % 2) * 0.045, -0.3 + i * 0.13); body.add(hx);
    }
  } else if (cos.decal === 'bolt') {
    for (const s of [-1, 1]) {
      const pts = [[0.36, -0.02], [0.08, -0.02], [0.14, -0.09], [-0.3, -0.09], [-0.06, -0.15], [-0.1, -0.06], [0.28, -0.06]];
      const sh = new THREE.Shape(); pts.forEach(([z, y], i) => (i ? sh.lineTo(z, y) : sh.moveTo(z, y)));
      const geo = new THREE.ShapeGeometry(sh); geo.rotateY(s * Math.PI / 2);
      const m = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ color: cos.accent, side: THREE.DoubleSide, emissive: new THREE.Color(cos.accent), emissiveIntensity: 0.25 }));
      m.position.x = s * (halfW + 0.006); body.add(m);
    }
  }

  // ---- wheels + fenders
  const wheels = [];
  const rimCol = cos.wheelColor === 'team' ? teamColor.main : WHEEL_COLORS[cos.wheelColor] ?? 0xd4d4d8;
  const tyreW = def.openWheel ? 0.2 : 0.17;
  for (const z of def.wheelZ) for (const s of [-1, 1]) {
    const w = buildWheel(cos.wheels, def.wheelR, rimCol, teamColor.main, tyreW);
    if (s < 0) w.scale.x = -1; // rim face outwards on both sides
    w.position.set(s * def.wheelX, GROUND + def.wheelR, z);
    w.userData.front = z > 0; w.userData.r = def.wheelR;
    root.add(w); wheels.push(w);
    if (def.fenders) { const f = fender(def.wheelR, tyreW, paint); f.position.set(s * (def.wheelX - 0.01), GROUND + def.wheelR, z); body.add(f); }
  }

  // ---- antenna & toppers
  const roofTop = Math.max(...def.cabin.map((c) => c[2]));
  const roofZ = (def.cabin[1][0] + def.cabin[2][0]) / 2;
  if (cos.antenna && cos.antenna !== 'none') {
    const ant = new THREE.Group();
    const stick = new THREE.Mesh(new THREE.CylinderGeometry(0.005, 0.005, 0.42, 6), new THREE.MeshStandardMaterial({ color: 0x9ca3af, metalness: 0.8, roughness: 0.3 }));
    stick.position.y = 0.21; ant.add(stick);
    let tip;
    if (cos.antenna === 'orb') tip = new THREE.Mesh(new THREE.SphereGeometry(0.035, 12, 8), new THREE.MeshBasicMaterial({ color: team }));
    else if (cos.antenna === 'flag') { tip = new THREE.Mesh(new THREE.PlaneGeometry(0.16, 0.09), new THREE.MeshStandardMaterial({ color: cos.accent, side: THREE.DoubleSide })); tip.rotation.y = Math.PI / 2; tip.position.z = -0.08; }
    else if (cos.antenna === 'star') tip = new THREE.Mesh(new THREE.OctahedronGeometry(0.05), new THREE.MeshStandardMaterial({ color: 0xfacc15, emissive: 0xfacc15, emissiveIntensity: 0.5 }));
    else tip = new THREE.Mesh(new THREE.ConeGeometry(0.03, 0.1, 4), new THREE.MeshBasicMaterial({ color: 0x60a5fa }));
    tip.position.y += 0.42; ant.add(tip);
    ant.position.set(-halfW * 0.55, def.stations[def.stations.length - 3][2], rearZ + 0.18);
    body.add(ant);
  }
  if (cos.topper === 'halo') { const hh = new THREE.Mesh(new THREE.TorusGeometry(0.16, 0.015, 8, 28), new THREE.MeshBasicMaterial({ color: 0xfde68a })); hh.rotation.x = Math.PI / 2; hh.position.set(0, roofTop + 0.15, roofZ); hh.userData.dynamic = true; body.add(hh); root.userData.halo = hh; }
  else if (cos.topper === 'fin') { const sh = new THREE.Shape(); sh.moveTo(0.1, 0); sh.lineTo(-0.12, 0.13); sh.lineTo(-0.14, 0); sh.closePath(); const g = new THREE.ExtrudeGeometry(sh, { depth: 0.02, bevelEnabled: false }); g.rotateY(-Math.PI / 2); const m = new THREE.Mesh(g, accent); m.position.set(0.01, roofTop, roofZ); body.add(m); }
  else if (cos.topper === 'cone') { const c = new THREE.Mesh(new THREE.ConeGeometry(0.08, 0.22, 16), new THREE.MeshStandardMaterial({ color: 0xf97316 })); c.position.set(0, roofTop + 0.12, roofZ); body.add(c); }
  else if (cos.topper === 'spikes') { for (let i = 0; i < 5; i++) { const c = new THREE.Mesh(new THREE.ConeGeometry(0.025, 0.12, 6), new THREE.MeshStandardMaterial({ color: 0xfacc15, metalness: 0.9, roughness: 0.2 })); const a = (i / 5) * Math.PI * 2; c.position.set(Math.cos(a) * 0.1, roofTop + 0.06, roofZ + Math.sin(a) * 0.1); body.add(c); } }

  // ---- underglow
